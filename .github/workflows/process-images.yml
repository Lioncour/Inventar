name: Process New Images

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-images
  cancel-in-progress: true

jobs:
  process-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BG_MODEL: birefnet-general
      U2NET_HOME: ${{ github.workspace }}/.u2net-models

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        ref: ${{ github.ref_name }}

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-bg.txt

    - name: Cache background-removal models
      uses: actions/cache@v4
      with:
        path: |
          .u2net-models
          ~/.cache/huggingface
        key: rembg-birefnet-general-v1

    - name: Install Node dependencies
      run: npm install --prefix .ci-node --no-save --no-package-lock --no-audit --no-fund googleapis

    - name: Install background-removal
      run: pip install -r requirements-bg.txt

    - name: Process new images
      env:
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        NODE_PATH: .ci-node/node_modules
        PYTHON: python
      run: node process-images.js

    - name: Commit changes
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add items.json images
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "Auto-update: Process new images from Google Drive"
        git pull --rebase origin "${GITHUB_REF_NAME}"
        git push origin "HEAD:${GITHUB_REF_NAME}"
