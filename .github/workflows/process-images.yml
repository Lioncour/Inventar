name: Process New Images

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-images
  cancel-in-progress: true

jobs:
  process-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        ref: ${{ github.ref_name }}

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Identify remove.bg account
      env:
        REMOVE_BG_API_KEY: ${{ secrets.REMOVE_BG_API_KEY }}
      run: |
        if [ -z "$REMOVE_BG_API_KEY" ]; then
          echo "No REMOVE_BG_API_KEY secret set; skipping account lookup"
          exit 0
        fi
        node -e "
        (async () => {
          const res = await fetch('https://api.remove.bg/v1.0/account', {
            headers: { 'X-Api-Key': process.env.REMOVE_BG_API_KEY }
          });
          const json = await res.json();
          if (!res.ok) {
            console.error('remove.bg account lookup failed:', res.status);
            console.error(JSON.stringify(json, null, 2));
            process.exit(1);
          }
          const attrs = json.data && json.data.attributes ? json.data.attributes : json;
          console.log('remove.bg account attributes (no API key):');
          console.log(JSON.stringify(attrs, null, 2));
        })().catch((error) => {
          console.error(error.message);
          process.exit(1);
        });
        "

    - name: Install dependencies
      run: npm install --prefix .ci-node --no-save --no-package-lock --no-audit --no-fund googleapis @imgly/background-removal-node

    - name: Process new images
      env:
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        NODE_PATH: .ci-node/node_modules
      run: node process-images.js

    - name: Commit changes
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add items.json images
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "Auto-update: Process new images from Google Drive"
        git pull --rebase origin "${GITHUB_REF_NAME}"
        git push origin "HEAD:${GITHUB_REF_NAME}"
